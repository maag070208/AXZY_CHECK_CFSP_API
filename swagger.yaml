  /sync:
    get:
      tags:
        - sync
      summary: 'Pull data (Offline)'
      parameters:
        -
          in: query
          name: last_pulled_at
          required: false
          schema:
            type: string
            pattern: ^\d+$
          description: 'Timestamp numérico de milisegundos para sincronización incremental'
        -
          in: query
          name: reset_models
          required: false
          schema:
            type: string
          description: 'Lista separada por comas de modelos que el cliente quiere recargar completos (tablas vacías).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
        '400':
          description: 'Petición inválida'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
        '500':
          description: 'Error interno del servidor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
    post:
      tags:
        - sync
      summary: 'Push data (Offline)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - changes
              properties:
                changes:
                  type: object
                  additionalProperties: {type: object, required: [created, updated, deleted], properties: {created: {type: array, items: {type: object}, description: 'Registros creados localmente en el cliente'}, updated: {type: array, items: {type: object}, description: 'Registros modificados localmente en el cliente'}, deleted: {type: array, items: {type: string}, description: 'IDs de registros eliminados localmente'}}}
      responses:
        '200':
          description: 'Lote aplicado por completo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResult'
              example:
                success: true
                data:
                  applied: true
                  summary: {kardex: {created: 2, updated: 0, deleted: 1}}
                  ignoredTables: []
                  rejected: []
                messages:
                  - Success
        '400':
          description: 'El lote NO se aplicó (es atómico). Incluye el detalle por registro para poder corregirlo o descartarlo.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: false}
                  data: {type: object, properties: {rejected: {type: array, description: 'Registros que el servidor no pudo aceptar.', items: {type: object, properties: {table: {type: string, example: kardex}, id: {type: string, format: uuid}, action: {type: string, enum: [create, update, delete]}, reason: {type: string, example: 'El punto de control indicado en locationId no existe en el servidor'}}}}, ignoredTables: {type: array, description: 'Tablas que el dispositivo no administra (se reportan, nunca se descartan en silencio).', items: {type: string, example: zone}}}}
                  messages: {type: array, items: {type: string}}
        '401':
          description: 'No autenticado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultError'
      description: "Envía (push) los cambios capturados offline y los aplica de forma ATÓMICA.\n\nGarantías del contrato para la cola offline:\n- **Atómico**: si algo se rechaza, NO se aplica nada del lote.\n- **Idempotente**: reenviar el mismo lote no duplica registros (upsert por id).\n- **Reintentable**: la APP conserva los cambios locales y puede reintentar.\n- **Diagnosticable**: se devuelve el detalle por registro (`rejected`) con tabla, id, acción y motivo, para corregirlo o descartarlo sin bloquear la cola.\n- **Sin descartes silenciosos**: las tablas que el dispositivo no administra se informan en `ignoredTables`.\n- **No se bloquea por versión**: el gate de versión sólo aplica al `pull`, para que el trabajo capturado sin red nunca quede atrapado.\n\nTablas aceptadas: `round`, `kardex`, `incident`, `maintenance`, `shiftHandover`, `uniformCheck`."
